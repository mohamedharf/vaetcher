{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div class="module">
    <h2>{% trans 'إرسال إيميل مخصص' %}</h2>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="action" value="{{ action_name }}">
        <input type="hidden" name="send_email_btn" value="1">
        {% for obj in queryset %}
            <input type="hidden" name="_selected_action" value="{{ obj.pk }}">
        {% endfor %}

        <div style="margin-bottom: 20px;">
            <p>{% trans 'سيتم إرسال هذا الإيميل إلى' %} <strong>{{ queryset|length }}</strong> {% trans 'مستخدم/مستخدمين.' %}</p>
        </div>

        <div style="margin-bottom: 20px;">
            <label for="subject" style="display: block; font-weight: bold; margin-bottom: 5px;">{% trans 'عنوان الإيميل:' %}</label>
            <input type="text" id="subject" name="subject" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 20px;">
            <label for="message" style="display: block; font-weight: bold; margin-bottom: 5px;">{% trans 'نص الإيميل:' %}</label>
            <textarea id="message" name="message" rows="10" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
        </div>

        <div>
            <input type="submit" value="{% trans 'إرسال الآن' %}" style="background-color: #005353; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
            <a href="." style="margin-right: 15px; color: #d9534f; text-decoration: none;">{% trans 'إلغاء' %}</a>
        </div>
    </form>
</div>
{% endblock %}
