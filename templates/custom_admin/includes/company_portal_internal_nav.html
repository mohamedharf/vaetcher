{% load i18n %}
{# active_tab: events | requests | vouchers | settlements | team #}
<div id="portal-tabs" class="portal-internal-nav">
    <div class="portal-internal-nav-links">
        <a href="{% url 'custom_company_portal' %}?tab=events" class="portal-tab-btn {% if active_tab == 'events' %}active{% endif %}">
            <i class="fa-solid fa-calendar-days"></i> {% trans 'الفعاليات المعتمدة' %}
        </a>
        <a href="{% url 'custom_company_portal' %}?tab=requests" class="portal-tab-btn {% if active_tab == 'requests' %}active{% endif %}">
            <i class="fa-solid fa-code-pull-request"></i> {% trans 'طلبات الفعاليات' %}
        </a>
        <a href="{% url 'custom_company_portal' %}?tab=vouchers" class="portal-tab-btn {% if active_tab == 'vouchers' %}active{% endif %}">
            <i class="fa-solid fa-users"></i> {% trans 'الأطباء والقسائم' %}
        </a>
        <a href="{% url 'custom_company_portal' %}?tab=settlements" class="portal-tab-btn {% if active_tab == 'settlements' %}active{% endif %}">
            <i class="fa-solid fa-file-invoice-dollar"></i> {% trans 'التسويات والمدفوعات' %}
        </a>
        <a href="{% url 'company_delegates_doctors' %}" class="portal-tab-btn {% if active_tab == 'team' %}active{% endif %}">
            <i class="fa-solid fa-users-gear"></i> {% trans 'المندوبون والأطباء' %}
        </a>
    </div>
    <a href="{% url 'custom_event_request_create' %}" class="portal-action-btn">
        <i class="fa-solid fa-plus"></i> {% trans 'طلب فعالية جديدة' %}
    </a>
</div>
