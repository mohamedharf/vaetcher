{% load i18n %}
<style>
/* Shared Settings Form Styles */
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 2rem; align-items: flex-start; }
.card-premium { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px); border-radius: 2rem; padding: 2.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid rgba(255,255,255,0.6); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
.card-premium:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.06); transform: translateY(-3px); background: rgba(255, 255, 255, 0.9); }
.card-premium::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, var(--primary) 0%, #4fd1c5 100%); opacity: 0; transition: opacity 0.4s ease; }
.card-premium:hover::before { opacity: 1; }
.card-danger::before { background: linear-gradient(90deg, #ef4444 0%, #f87171 100%); }
.form-group { margin-bottom: 1.5rem; position: relative; text-align: right; }
.form-group label { display: block; font-size: 0.85rem; font-weight: 900; color: var(--on-surface-variant); margin-bottom: 0.75rem; }
.input-modern { width: 100%; padding: 1.2rem 1.5rem; background: #fdfdfd; border: 2px solid #e2e8f0; border-radius: 1.2rem; font-weight: 700; color: var(--on-surface); transition: all 0.3s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
.input-modern:focus { background: white; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0, 83, 83, 0.1); outline: none; transform: translateY(-1px); }
textarea.input-modern { min-height: 120px; resize: vertical; }
.btn-action { display: inline-flex; align-items: center; justify-content: center; gap: 0.75rem; padding: 1.2rem 2.5rem; border-radius: 1.2rem; font-weight: 900; transition: all 0.4s; width: 100%; border: none; cursor: pointer; font-size: 1.1rem; }
.btn-action-primary { background: linear-gradient(135deg, var(--primary) 0%, #007c7c 100%); color: white; box-shadow: 0 8px 20px rgba(0, 83, 83, 0.2); }
.btn-action-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0, 83, 83, 0.3); }
.btn-action-danger { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.2); }
.btn-action-danger:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(239, 68, 68, 0.3); }
.btn-action-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2); }
.btn-action-success:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(16, 185, 129, 0.3); }
.icon-header { width: 64px; height: 64px; border-radius: 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1.5rem; color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
.icon-primary { background: linear-gradient(135deg, var(--primary) 0%, #007c7c 100%); box-shadow: 0 10px 20px rgba(0, 83, 83, 0.2); }
.icon-danger { background: linear-gradient(135deg, #ef4444 0%, #f87171 100%); box-shadow: 0 10px 20px rgba(239, 68, 68, 0.2); }
.icon-success { background: linear-gradient(135deg, #10b981 0%, #34d399 100%); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2); }
</style>
<div class="settings-grid">
    <!-- Profile Form -->
    <div class="card-premium">
        <div class="icon-header icon-primary"><i class="fa-solid fa-building-flag"></i></div>
        <h2 class="text-2xl font-black text-stone-800 mb-6">{% trans 'بيانات المؤسسة' %}</h2>
        <form method="post" action="{% url form_action_url %}" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="action" value="update_profile">
            
            <div style="display: flex; gap: 1.5rem; margin-bottom: 2rem; align-items: center; background: var(--surface-container-lowest, #fff); padding: 1.5rem; border-radius: 1.5rem; border: 1px dashed var(--outline-variant, #ccc);">
                <div style="width: 80px; height: 80px; border-radius: 1.2rem; overflow: hidden; background: #eee; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex-shrink: 0;">
                    <img id="logoPreview" src="{% if target_vendor.logo %}{{ target_vendor.logo.url }}{% else %}https://ui-avatars.com/api/?name={{ target_vendor.name }}&background=006d6d&color=fff{% endif %}" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div style="flex: 1;">
                    <label class="block text-xs font-black text-stone-500 uppercase tracking-wide mb-2">{% trans 'تحديث شعار المؤسسة' %}</label>
                    <input type="file" name="logo" accept="image/*" onchange="previewLogo(this)" class="block w-full text-sm text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-primary/10 file:text-primary hover:file:bg-primary/20 transition-all cursor-pointer">
                </div>
            </div>
            
            <div class="form-group">
                <label>{% trans 'اسم المؤسسة' %}</label>
                <input type="text" name="name" value="{{ target_vendor.name }}" class="input-modern" required>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="form-group">
                    <label>{% trans 'المدير المسؤول' %}</label>
                    <input type="text" name="contact_person" value="{{ target_vendor.contact_person|default:'' }}" class="input-modern">
                </div>
                <div class="form-group">
                    <label>{% trans 'رقم الهاتف المعتمد' %}</label>
                    <input type="text" name="phone" value="{{ target_vendor.phone|default:'' }}" class="input-modern num-font" required>
                </div>
            </div>
            <div class="form-group">
                <label>{% trans 'البريد الإلكتروني للشكاوى' %}</label>
                <input type="email" name="email" value="{{ target_vendor.email|default:'' }}" class="input-modern num-font" style="text-align: left;" dir="ltr">
            </div>
            <div class="form-group mb-8">
                <label>{% trans 'العنوان التفصيلي المقر' %}</label>
                <input type="text" name="address" value="{{ target_vendor.address|default:'' }}" class="input-modern">
            </div>
            
            <button type="submit" class="btn-action btn-action-primary">
                <i class="fa-solid fa-cloud-arrow-up"></i> {% trans 'حفظ تحديثات الهوية' %}
            </button>
        </form>
    </div>
    
    <div>
        <!-- Financial Settings -->
        <div class="card-premium mb-8">
            <div class="icon-header icon-success"><i class="fa-solid fa-vault"></i></div>
            <h2 class="text-2xl font-black text-stone-800 mb-6">{% trans 'البيانات المالية للتسويات' %}</h2>
            <form method="post" action="{% url form_action_url %}">
                {% csrf_token %}
                <input type="hidden" name="action" value="update_financial">
                
                <div class="form-group">
                    <label>{% trans 'البيانات البنكية الأساسية (IBAN, حساب)' %}</label>
                    <textarea name="bank_info" rows="4" class="input-modern" placeholder="{% trans 'أدخل اسم البنك، رقم الحساب، والآيبان بدقة...' %}">{{ target_vendor.bank_info|default:'' }}</textarea>
                </div>
                
                <div class="form-group">
                    <label>{% trans 'المحافظ الإلكترونية (للدفع السريع)' %}</label>
                    <textarea name="wallet_info" rows="3" class="input-modern" placeholder="{% trans 'فودافون كاش - اتصالات كاش...' %}">{{ target_vendor.wallet_info|default:'' }}</textarea>
                </div>
                
                <div class="form-group mb-8">
                    <label>{% trans 'إرشادات وتعليمات مالية إضافية' %}</label>
                    <textarea name="other_info" rows="3" class="input-modern" placeholder="{% trans 'أي تعليمات تود إظهارها للموردين بخصوص التحويلات...' %}">{{ target_vendor.other_info|default:'' }}</textarea>
                </div>
                
                <button type="submit" class="btn-action btn-action-success">
                    <i class="fa-solid fa-lock"></i> {% trans 'توثيق البيانات المالية' %}
                </button>
            </form>
        </div>

        <!-- Security / Password Settings -->
        <div class="card-premium card-danger">
            <div class="icon-header icon-danger"><i class="fa-solid fa-shield-halved"></i></div>
            <h2 class="text-2xl font-black text-stone-800 mb-6">{% trans 'تغيير كلمة المرور للإدارة' %}</h2>
            <form method="post" action="{% url form_action_url %}">
                {% csrf_token %}
                <input type="hidden" name="action" value="change_admin_password">
                
                <div class="form-group">
                    <label>{% trans 'كلمة المرور الحالية' %}</label>
                    <input type="password" name="current_password" class="input-modern" required>
                </div>
                
                <div class="form-group">
                    <label>{% trans 'كلمة المرور الجديدة' %}</label>
                    <input type="password" name="new_password" class="input-modern" required minlength="6">
                </div>
                
                <div class="form-group mb-8">
                    <label>{% trans 'تأكيد كلمة المرور الجديدة' %}</label>
                    <input type="password" name="confirm_password" class="input-modern" required minlength="6">
                </div>
                
                <button type="submit" class="btn-action btn-action-danger">
                    <i class="fa-solid fa-key"></i> {% trans 'فرض تغيير كلمة المرور' %}
                </button>
            </form>
        </div>
    </div>
</div>
<script>
    function previewLogo(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader;
            reader.onload = function(e) {
                document.getElementById('logoPreview').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
